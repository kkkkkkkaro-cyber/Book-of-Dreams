<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f1df"/><stop offset="1" stop-color="#ecdcba"/></linearGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0.09 0"/></filter>
<filter id="wash" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="10" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="26"/><feGaussianBlur stdDeviation="4"/></filter>
<filter id="ink" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="12"/><feGaussianBlur stdDeviation="1.5"/></filter>
<linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a" stop-opacity=".22"/><stop offset="1" stop-color="#3a3a3a" stop-opacity="0"/></linearGradient>
</defs>
<rect width="600" height="800" fill="url(#paper)"/>
<rect width="600" height="800" filter="url(#grain)"/>
<path d="M0 800 L0 700 Q80 640 150 690 Q230 630 320 690 Q400 650 470 700 Q540 660 600 690 L600 800 Z" fill="url(#mt)" filter="url(#ink)"/>
