<text x="1041" y="178" text-anchor="middle" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="20" font-weight="900" fill="#f7eed6">解</text>
<text x="1041" y="202" text-anchor="middle" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="20" font-weight="900" fill="#f7eed6">夢</text>
