<text x="343" y="182" text-anchor="middle" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="24" font-weight="700" fill="#3b2a52" letter-spacing="4">解梦示例</text>
<text x="343" y="205" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" fill="#8a6f4e">Sample Reading · 中文</text>
<line x1="223" y1="218" x2="329" y2="218" stroke="#a8432f" stroke-width="1" opacity=".6"/><path d="M337 218 l6 -5 l6 5 l-6 5 z" fill="#a8432f" opacity=".75"/><line x1="357" y1="218" x2="463" y2="218" stroke="#a8432f" stroke-width="1" opacity=".6"/>
<text x="343" y="250" text-anchor="middle" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="16.5" font-style="italic" fill="#5b4a3a">—— 我梦到牙齿掉了，梦里很害怕 ——</text>
<path d="M148 279 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="162" y="284" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" font-weight="700" fill="#3b2a52">一句话结论</text>
<text x="162" y="306" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="14.5" fill="#3d3327">提醒注意，属《夢列》所说的“想梦”：</text>
<text x="162" y="327" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">「人有所思，即夢其到」</text>
<path d="M148 350 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="162" y="355" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" font-weight="700" fill="#3b2a52">原典怎么说</text>
<text x="162" y="377" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">《身體面目齒髮》「齒自落者父母凶」</text>
<text x="162" y="398" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="14.5" fill="#3d3327">牙自己掉，古人认为要多关心长辈；</text>
<text x="162" y="419" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">「齒落更生子孫興」</text>
<text x="162" y="440" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="14.5" fill="#3d3327">掉了又长出来，便转为吉兆。</text>
<path d="M148 463 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="162" y="468" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" font-weight="700" fill="#3b2a52">你梦里很害怕</text>
<text x="162" y="490" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="14.5" fill="#3d3327">《夢列》说，梦凶而心惧，才需当真留意。</text>
<path d="M148 513 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="162" y="518" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" font-weight="700" fill="#3b2a52">它可能在说你什么</text>
<text x="162" y="540" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="14.5" fill="#3d3327">掉牙梦常与焦虑、失控感有关。</text>
<path d="M148 563 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="162" y="568" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" font-weight="700" fill="#3b2a52">一个小建议</text>
<text x="162" y="590" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="14.5" fill="#3d3327">给家里打个电话。</text>
<text x="162" y="611" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">「見妖而戒懼者，禍轉為福」</text>
<text x="343" y="664" text-anchor="middle" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="13" fill="#8a6f4e">· 一 ·</text>
<text x="857" y="182" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#3b2a52" letter-spacing="1">Sample Reading</text>
<text x="857" y="205" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" fill="#8a6f4e">解梦示例 · English</text>
<line x1="737" y1="218" x2="843" y2="218" stroke="#a8432f" stroke-width="1" opacity=".6"/><path d="M851 218 l6 -5 l6 5 l-6 5 z" fill="#a8432f" opacity=".75"/><line x1="871" y1="218" x2="977" y2="218" stroke="#a8432f" stroke-width="1" opacity=".6"/>
<text x="857" y="250" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16.5" font-style="italic" fill="#5b4a3a">“I dreamed my teeth fell out. I was scared.”</text>
<path d="M662 279 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="676" y="284" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="700" fill="#3b2a52">The verdict</text>
<text x="676" y="306" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">A gentle warning; a "reflective" dream:</text>
<text x="676" y="327" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">「人有所思，即夢其到」</text>
<path d="M662 350 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="676" y="355" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="700" fill="#3b2a52">What the classics say</text>
<text x="676" y="377" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">「齒自落者父母凶」</text>
<text x="676" y="398" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">Teeth falling out: look out for your parents.</text>
<text x="676" y="419" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="15.5" fill="#9b3b28">「齒落更生子孫興」</text>
<text x="676" y="440" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">If they grow back, the omen turns lucky.</text>
<path d="M662 463 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="676" y="468" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="700" fill="#3b2a52">You felt afraid</text>
<text x="676" y="490" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">Menglie: an ill dream felt with fear deserves care.</text>
<path d="M662 513 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="676" y="518" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="700" fill="#3b2a52">What it may be saying</text>
<text x="676" y="540" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">Tooth dreams often reflect anxiety or loss of control.</text>
<path d="M662 563 l5 -5 l5 5 l-5 5 z" fill="#a8432f"/>
<text x="676" y="568" font-family="Georgia,'Times New Roman',serif" font-size="15.5" font-weight="700" fill="#3b2a52">One small step</text>
<text x="676" y="590" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">Call home. Meet a bad omen with care,</text>
<text x="676" y="611" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#3d3327">and misfortune turns to blessing.</text>
<text x="857" y="664" text-anchor="middle" font-family="'Noto Serif CJK SC','Noto Serif CJK TC','Songti SC','STSong','SimSun',serif" font-size="13" fill="#8a6f4e">· 1 ·</text>
